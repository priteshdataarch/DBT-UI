# Run from this directory (where dbt_project.yml lives):
#   docker compose up --build
#
# UI: http://localhost:3001  (host port → container 3001; change `ports` below if 3001 is taken)
#
# Set secrets in a `.env` file next to this compose file, or export variables before `docker compose up`.

services:
  dbt-ui:
    build:
      context: .
      dockerfile: dbt-ui/Dockerfile
    ports:
      - '3001:3001'
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-openssl-rand-hex-32}
      DATABASE_URL: ${DATABASE_URL:-file:/data/prisma-docker.db}
      DBT_PROJECT_ROOT: /dbt
      DBT_BIN: ${DBT_BIN:-/usr/local/bin/dbt}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DBT_UI_REQUIRE_LOGIN: ${DBT_UI_REQUIRE_LOGIN:-false}
    volumes:
      # Persist SQLite only — do not mount over prisma/ or schema.prisma would be hidden.
      - dbt-ui-sqlite:/data
      # Optional: mount AWS credentials into the container (uncomment if not using env vars)
      # - ~/.aws:/root/.aws:ro
      # Optional: mount warehouse profiles (keep secrets out of the image)
      # - ./profiles.yml:/dbt/profiles.yml:ro

volumes:
  dbt-ui-sqlite:
